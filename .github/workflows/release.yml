# Publishes one package at the version in its manifest, then tags the commit and creates a GitHub release.
# Run it from the Actions tab (Release → Run workflow) and pick the package, or: gh workflow run release.yml -f package=syntax
# See README.md, Releasing.
name: Release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        required: true
        options: [syntax, vscode, jupyterlab]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm and PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jupyterlab
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - run: npm test
      - id: version
        run: echo "version=$(node -p 'require("./packages/${{ inputs.package }}/package.json").version')" >> "$GITHUB_OUTPUT"

      - if: inputs.package == 'syntax'
        run: npm publish -w packages/syntax
      - if: inputs.package == 'vscode'
        run: npm run package -w packages/vscode && npx -w packages/vscode @vscode/vsce publish --no-dependencies --packagePath packages/vscode/myst-syntax.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - if: inputs.package == 'jupyterlab'
        run: npm run build -w packages/jupyterlab && pip install build && python -m build packages/jupyterlab --outdir dist
      - if: inputs.package == 'jupyterlab'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.package }}-v${{ steps.version.outputs.version }}
