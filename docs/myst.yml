version: 1
extends:
  - https://raw.githubusercontent.com/myst-contrib/myst-contrib.github.io/main/docs/footer.yml
project:
  id: myst-syntax
  title: myst-syntax
  github: https://github.com/choldgraf/myst-syntax
  plugins:
    # Rewrites relative links in the included repo files, like the READMEs and ROADMAP, to point at GitHub.
    - https://github.com/myst-contrib/myst-include-link-rewrites/releases/latest/download/index.mjs
  toc:
    - file: index.md
    - title: Packages
      children:
        - file: syntax.md
        - file: vscode.md
        - file: jupyterlab.md
    - file: findings.md
    - file: roadmap.md
site:
  template: book-theme
  options:
    logo_text: myst-syntax
